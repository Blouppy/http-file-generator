name: Build

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js 📦
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies 📂
        run: npm ci

      - name: Lint 📝
        run: npm run lint

      - name: Build 🧱
        run: npm run build

      - name: Test 🧪
        run: npm run test -- --ci
